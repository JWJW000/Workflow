[workspace]
members = [
  "crates/workflow-core",
  "crates/workflow-expression",
  "crates/workflow-schema",
  "crates/workflow-definition",
  "crates/workflow-actions",
  "crates/driver-drission",
  "crates/workflow-artifacts",
  "crates/workflow-engine",
  "crates/workflow-store",
  "crates/workflow-runner",
  "crates/workflow-api",
  "crates/workflow-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
axum = "0.8"
async-stream = "0.3"
hex = "0.4"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_drission = "=0.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
