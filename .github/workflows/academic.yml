name: Build academic service
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: academic
          push: true
          tags: ghcr.io/jwjw000/workflow-academic:release-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=academic
          cache-to: type=gha,scope=academic,mode=max
