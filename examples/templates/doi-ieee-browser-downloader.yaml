apiVersion: drission.workflow/v1
kind: Workflow

metadata:
  name: doi-ieee-browser-downloader
  title: IEEE DOI 校园网真实浏览器下载
  description: 使用独立 IEEE 校园网 Chrome Profile，避免与 Nature 下载任务争抢锁。
  tags: [academic, doi, ieee, campus-vpn, real-browser, pdf-downloader]

inputs:
  articles:
    type: array
    required: true

browser:
  mode: launch
  headless: false
  profile: persistent:.drission-workflow/profiles/doi-ieee-campus
  downloadDir: downloads
  noImages: false

defaults:
  timeout: 120s
  retry:
    maxAttempts: 1

steps:
  - id: launch_browser
    name: 启动 IEEE 校园网专用 Chrome
    action: browser.launch
    with:
      headless: false
      profile: persistent:.drission-workflow/profiles/doi-ieee-campus
      noImages: false

  - id: inject_initial_stealth
    name: 初始化浏览器反检测环境
    action: browser.injectStealth
    onError: continue

  - id: authenticate_buaa
    name: 建立北航 WebVPN 会话（首次运行请在窗口中手动登录）
    action: page.goto
    timeout: 310s
    with:
      url: "https://d.buaa.edu.cn/https/77726476706e69737468656265737421f9f244993f20645f6c0dc7a59d50267b1ab4a9/Xplore/home.jsp"

  - id: download_articles
    name: 串行下载 IEEE PDF
    foreach:
      items: "${inputs.articles}"
      itemName: article
      maxItems: 500
      concurrency: 1
      steps:
        - id: inject_page_stealth
          name: 下载前刷新反检测环境
          action: browser.injectStealth
          onError: continue

        - id: warmup_wait
          name: 短暂下载间隔
          action: data.randomWait
          onError: continue
          with:
            minDuration: 300ms
            maxDuration: 800ms

        - id: download_pdf
          name: IEEE PDF 下载
          action: download.click
          timeout: 120s
          onError: continue
          with:
            url: "${article.url}"
            filename: "${article.filename}"

outputs:
  requested: "${inputs.articles}"
