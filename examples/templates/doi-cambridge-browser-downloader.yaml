apiVersion: drission.workflow/v1
kind: Workflow
metadata:
  name: doi-cambridge-browser-downloader
  title: Cambridge Core DOI 北航 WebVPN 下载
  tags: [academic, doi, cambridge, webvpn, real-browser]
inputs:
  articles: {type: array, required: true}
browser:
  mode: launch
  headless: false
  profile: persistent:.drission-workflow/profiles/doi-cambridge-buaa-campus
  downloadDir: downloads
  noImages: false
defaults:
  timeout: 120s
  retry: {maxAttempts: 1}
steps:
  - id: launch_browser
    action: browser.launch
    with:
      headless: false
      profile: persistent:.drission-workflow/profiles/doi-cambridge-buaa-campus
      noImages: false
  - id: authenticate_buaa
    action: page.goto
    timeout: 1210s
    with:
      url: "https://d.buaa.edu.cn/https/77726476706e69737468656265737421e7e056d2243165526c018dab9d1b2c2702/"
  - id: download_articles
    foreach:
      items: "${inputs.articles}"
      itemName: article
      maxItems: 500
      concurrency: 1
      steps:
        - id: open_article
          action: page.goto
          timeout: 120s
          onError: continue
          with: {url: "${article.url}"}
        - id: wait
          action: data.randomWait
          onError: continue
          with: {minDuration: 8000ms, maxDuration: 15000ms}
        - id: wait_pdf
          action: page.wait
          timeout: 60s
          onError: continue
          with:
            locator:
              anyOf:
                - "css:a[href*='/core/services/aop-cambridge-core/content/view/']"
                - "css:a[href*='aop-cambridge-core']"
                - "css:a[href*='/core/services/aop-file-manager/']"
                - "css:a[href*='.pdf']"
                - "css:a[aria-label*='PDF']"
                - "text:View PDF"
                - "text:PDF"
        - id: download_pdf
          action: download.click
          timeout: 120s
          onError: continue
          with:
            locator:
              anyOf:
                - "css:a[href*='/core/services/aop-cambridge-core/content/view/']"
                - "css:a[href*='aop-cambridge-core']"
                - "css:a[href*='/core/services/aop-file-manager/']"
                - "css:a.action-btn[href*='/core/services/aop-file-manager/']"
                - "css:a.pdf[href*='/core/journals/']"
                - "css:a[href$='.pdf']"
                - "css:a[href*='.pdf?']"
                - "css:a[href*='pdf']"
                - "css:a[aria-label*='View PDF']"
                - "css:a[aria-label*='PDF']"
                - "css:a[title*='PDF']"
                - "css:a.cbo-view-pdf"
                - "css:.pdf-link a"
                - "text:View PDF"
                - "text:PDF"
            filename: "${article.filename}"

outputs: {requested: "${inputs.articles}"}
